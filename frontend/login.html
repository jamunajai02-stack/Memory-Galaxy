<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Memory Galaxy</title>
  <link rel="icon" href="assets/icons/star.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <canvas id="space-canvas" aria-hidden="true"></canvas>
  <div class="nebula-wash"></div>

  <div class="alien alien-luna" id="alien-luna" aria-hidden="true">
    <svg viewBox="0 0 160 180">
      <ellipse class="glow" cx="80" cy="108" rx="46" ry="14" />
      <path class="antenna" d="M78 38 C70 12, 52 10, 46 22" />
      <circle class="tip" cx="44" cy="20" r="6" />
      <ellipse class="body" cx="80" cy="108" rx="42" ry="50" />
      <circle class="head" cx="80" cy="70" r="40" />
      <ellipse class="eye" cx="64" cy="72" rx="12" ry="16" />
      <ellipse class="eye" cx="96" cy="72" rx="12" ry="16" />
      <circle class="pupil blink" cx="66" cy="76" r="5" />
      <circle class="pupil blink" cx="98" cy="76" r="5" />
      <circle class="shine" cx="61" cy="66" r="3" />
      <circle class="shine" cx="93" cy="66" r="3" />
      <path class="smile" d="M68 92 Q80 102 92 92" />
      <ellipse class="cheek" cx="50" cy="86" rx="7" ry="4" />
      <ellipse class="cheek" cx="110" cy="86" rx="7" ry="4" />
      <path class="arm left" d="M42 112 Q18 100 22 84" />
      <path class="arm right" d="M118 112 Q142 96 138 78" />
      <ellipse class="foot" cx="64" cy="156" rx="12" ry="7" />
      <ellipse class="foot" cx="96" cy="156" rx="12" ry="7" />
    </svg>
  </div>
  <div class="alien alien-nix" id="alien-nix" aria-hidden="true">
    <svg viewBox="0 0 160 180">
      <ellipse class="glow" cx="80" cy="108" rx="46" ry="14" />
      <path class="antenna" d="M82 36 C96 8, 122 18, 116 32" />
      <circle class="tip" cx="118" cy="30" r="6" />
      <ellipse class="body" cx="80" cy="110" rx="40" ry="48" />
      <circle class="head" cx="80" cy="68" r="38" />
      <ellipse class="eye" cx="64" cy="70" rx="13" ry="17" />
      <ellipse class="eye" cx="98" cy="70" rx="13" ry="17" />
      <circle class="pupil blink" cx="67" cy="75" r="5.5" />
      <circle class="pupil blink" cx="101" cy="75" r="5.5" />
      <circle class="shine" cx="60" cy="64" r="3" />
      <circle class="shine" cx="94" cy="64" r="3" />
      <path class="smile" d="M70 90 Q80 98 90 90" />
      <ellipse class="spot" cx="80" cy="122" rx="9" ry="6" />
      <path class="arm left" d="M44 114 Q20 128 28 146" />
      <path class="arm right" d="M116 114 Q144 108 148 90" />
      <ellipse class="foot" cx="64" cy="156" rx="12" ry="7" />
      <ellipse class="foot" cx="96" cy="156" rx="12" ry="7" />
    </svg>
  </div>

  <a class="brand auth-brand" href="index.html"><i class="fa-solid fa-star"></i> Memory Galaxy</a>

  <main class="auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Login to Galaxy</h1>
    <p class="lede">Your private universe is waiting.</p>
    <p id="flash" class="flash" hidden></p>
    <form id="login-form" novalidate>
      <label>Email or Phone
        <input name="identifier" autocomplete="username" placeholder="you@orbit.com or +1 555 0134" required />
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <p id="form-error" class="form-error" hidden></p>
      <button class="btn btn-primary" type="submit">LOGIN TO GALAXY</button>
    </form>
    <div class="auth-links">
      <a href="forgot-password.html">FORGOT PASSWORD?</a>
      <a href="register.html">CREATE ACCOUNT</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/space-bg.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
