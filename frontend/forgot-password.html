<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password · Memory Galaxy</title>
  <link rel="icon" href="assets/icons/star.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <canvas id="space-canvas"></canvas>
  <div class="nebula-wash"></div>
  <a class="brand auth-brand" href="index.html"><i class="fa-solid fa-star"></i> Memory Galaxy</a>

  <main class="auth-card wide">
    <p class="eyebrow">Recover your orbit key</p>
    <h1>Forgot Password</h1>
    <p class="lede">Reset by email, or answer the recovery question you chose when you created your galaxy.</p>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="email">Email reset</button>
      <button type="button" class="tab" data-tab="question">Recovery question</button>
    </div>

    <form id="email-form" class="tab-panel" data-panel="email">
      <label>Email
        <input name="email" type="email" required />
      </label>
      <p id="email-error" class="form-error" hidden></p>
      <p id="email-success" class="flash" hidden></p>
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>

    <div id="question-flow" class="tab-panel" data-panel="question" hidden>
      <form id="question-lookup">
        <label>Email
          <input name="email" type="email" required />
        </label>
        <button class="btn btn-ghost" type="submit">Find question</button>
      </form>
      <form id="question-reset" hidden>
        <p class="recovery-q">Recovery Question:</p>
        <p id="question-text" class="question-text"></p>
        <label>Answer
          <input name="answer" required />
        </label>
        <label>Create New Password
          <input name="password" type="password" minlength="8" required />
        </label>
        <label>Confirm New Password
          <input name="confirmPassword" type="password" minlength="8" required />
        </label>
        <button class="btn btn-primary" type="submit">Verify Answer</button>
      </form>
      <p id="question-error" class="form-error" hidden></p>
      <p id="question-success" class="flash" hidden></p>
    </div>

    <p class="auth-links"><a href="login.html">Back to login</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/space-bg.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
