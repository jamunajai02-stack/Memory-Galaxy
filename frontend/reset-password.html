<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Memory Galaxy</title>
  <link rel="icon" href="assets/icons/star.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <canvas id="space-canvas"></canvas>
  <div class="nebula-wash"></div>
  <a class="brand auth-brand" href="index.html"><i class="fa-solid fa-star"></i> Memory Galaxy</a>

  <main class="auth-card">
    <p class="eyebrow">New orbit key</p>
    <h1>Reset Password</h1>
    <p class="lede">This link expires after 30 minutes and can be used only once.</p>
    <form id="reset-form" novalidate>
      <input type="hidden" name="token" id="reset-token" />
      <label>New Password
        <input name="password" type="password" minlength="8" required />
      </label>
      <label>Confirm Password
        <input name="confirmPassword" type="password" minlength="8" required />
      </label>
      <p id="form-error" class="form-error" hidden></p>
      <button class="btn btn-primary" type="submit">Save password</button>
    </form>
    <p class="auth-links"><a href="login.html">Back to login</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/space-bg.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
