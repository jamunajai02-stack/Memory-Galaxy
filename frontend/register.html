<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Memory Galaxy</title>
  <link rel="icon" href="assets/icons/star.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <canvas id="space-canvas"></canvas>
  <div class="nebula-wash"></div>
  <a class="brand auth-brand" href="index.html"><i class="fa-solid fa-star"></i> Memory Galaxy</a>

  <main class="auth-card wide">
    <p class="eyebrow">Claim your constellation</p>
    <h1>Create Your Galaxy</h1>
    <p class="lede">Every memory becomes a star. Choose a recovery question you will remember.</p>
    <form id="register-form" novalidate>
      <label>Full Name
        <input name="name" maxlength="80" autocomplete="name" required />
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email" required />
      </label>
      <label>Phone Number
        <input name="phone" type="tel" autocomplete="tel" placeholder="Optional, must be unique" />
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label>Confirm Password
        <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label>Recovery Question
        <select name="recoveryQuestion" required>
          <option value="">Choose a question</option>
          <option>What was your childhood nickname?</option>
          <option>What is your favorite cartoon?</option>
          <option>What food could you eat forever?</option>
          <option>What was your first favorite movie?</option>
          <option>What is your dream travel destination?</option>
          <option>What was your favorite school subject?</option>
        </select>
      </label>
      <label>Recovery Answer
        <input name="recoveryAnswer" maxlength="80" required />
      </label>
      <p id="form-error" class="form-error" hidden></p>
      <button class="btn btn-primary" type="submit">Create Galaxy</button>
    </form>
    <p class="auth-links"><a href="login.html">Already have a galaxy? Login</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/space-bg.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
